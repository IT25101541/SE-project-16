# ============ SERVER ============
# PORT is provided automatically by most hosting platforms (e.g. Render).
# Locally, nothing is set, so it falls back to 8080 exactly as before.
server.port=${PORT:8080}

# ============ DATABASE (MySQL) ============
# Each value falls back to your original local settings when the
# matching environment variable isn't set, so local development is
# completely unaffected. When deploying, set DATABASE_URL / DATABASE_USERNAME /
# DATABASE_PASSWORD as environment variables on the host instead of editing this file.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/creativepulse_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ JPA / HIBERNATE ============
# 'update' = Hibernate creates/updates the tables from your @Entity classes automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============ THYMELEAF ============
spring.thymeleaf.cache=false

# ============ FILE UPLOAD (advertisement designs) ============
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ============ LOGGING ============
logging.level.org.springframework.security=INFO
