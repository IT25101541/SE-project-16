<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main('User Management', ~{::section})}">
<body>
<section>
    <div class="card-cp">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <form class="d-flex gap-2" th:action="@{/users}" method="get">
                <input class="form-control" style="width:260px" name="keyword"
                       th:value="${keyword}" placeholder="Search by name or username...">
                <button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button>
            </form>
            <a th:href="@{/users/new}" class="btn btn-brand"><i class="bi bi-plus-lg me-1"></i>Add User</a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr>
                    <th>#</th><th>Full Name</th><th>Username</th><th>Email</th>
                    <th>Phone</th><th>Role</th><th>Status</th><th class="text-end">Actions</th>
                </tr></thead>
                <tbody>
                <tr th:each="u,i : ${users}">
                    <td th:text="${i.count}"></td>
                    <td class="fw-semibold" th:text="${u.fullName}"></td>
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.phone}"></td>
                    <td><span class="badge-soft bg-primary-subtle text-primary-emphasis"
                              th:text="${u.role.label}"></span></td>
                    <td>
                        <span th:if="${u.active}" class="badge-soft bg-success-subtle text-success-emphasis">Active</span>
                        <span th:unless="${u.active}" class="badge-soft bg-secondary-subtle text-secondary-emphasis">Inactive</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/users/view/' + ${u.id}}" class="btn btn-sm btn-outline-secondary" title="View"><i class="bi bi-eye"></i></a>
                        <a th:href="@{'/users/edit/' + ${u.id}}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i></a>
                        <a th:href="@{'/users/delete/' + ${u.id}}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Delete this user permanently?')">
                            <i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="8"><div class="empty-state"><i class="bi bi-people"></i><div class="es-title">No users yet</div><div>Nothing to show in this view right now.</div></div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
