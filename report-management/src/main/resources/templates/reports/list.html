<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Reports</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h2>My Reports</h2>
    <a class="btn" href="/reports/new">+ New Report</a>

    <table>
        <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
        </tr>
        <tr th:each="report : ${reports}">
            <td th:text="${report.title}"></td>
            <td th:text="${report.category}"></td>
            <td>
                <span th:text="${report.status}"
                      th:classappend="${report.status == 'APPROVED'} ? 'status-approved' : (${report.status == 'REJECTED'} ? 'status-rejected' : 'status-pending')">
                </span>
            </td>
            <td th:text="${#temporals.format(report.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <a th:href="@{/reports/view/{id}(id=${report.id})}">View</a> |
                <a th:href="@{/reports/edit/{id}(id=${report.id})}">Edit</a> |
                <a th:href="@{/reports/delete/{id}(id=${report.id})}"
                   onclick="return confirm('Delete this report?');">Delete</a> |
                <a th:if="${report.filePath != null}"
                   th:href="@{/reports/download/{id}(id=${report.id})}">Download</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(reports)}">
            <td colspan="5">No reports yet. Create your first one.</td>
        </tr>
    </table>
</div>
</body>
</html>
