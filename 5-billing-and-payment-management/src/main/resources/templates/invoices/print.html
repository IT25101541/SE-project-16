<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Invoice ' + ${invoice.invoiceNumber}">Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>h3{color:#2e1c8c}h4,h5{color:#140e38}.btn-dark{background:#5837ab;border-color:#5837ab}body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="p-5">
<div class="d-flex justify-content-between align-items-start mb-4">
    <div>
        <h3 class="fw-bold mb-0">CreativePulse Advertising</h3>
        <small class="text-muted">Colombo, Sri Lanka &middot; info@creativepulse.lk</small>
    </div>
    <div class="text-end">
        <h4 class="fw-bold mb-0">INVOICE</h4>
        <div th:text="${invoice.invoiceNumber}"></div>
    </div>
</div>
<div class="row mb-4">
    <div class="col-6">
        <strong>Bill To</strong>
        <div th:text="${invoice.client.companyName}"></div>
        <div th:text="${invoice.client.address}"></div>
        <div th:text="${invoice.client.email}"></div>
    </div>
    <div class="col-6 text-end">
        <div><strong>Issue Date:</strong> <span th:text="${invoice.issueDate}"></span></div>
        <div><strong>Due Date:</strong> <span th:text="${invoice.dueDate}"></span></div>
        <div><strong>Status:</strong> <span th:text="${invoice.status}"></span></div>
    </div>
</div>
<table class="table table-bordered">
    <thead class="table-light"><tr><th>Description</th><th class="text-end">Amount (LKR)</th></tr></thead>
    <tbody>
    <tr>
        <td th:text="${invoice.campaign != null ? 'Advertising services - ' + invoice.campaign.name : 'Advertising services'}"></td>
        <td class="text-end" th:text="${#numbers.formatDecimal(invoice.amount,1,'COMMA',2,'POINT')}"></td>
    </tr>
    <tr><td class="text-end">Tax (<span th:text="${invoice.taxPercent}"></span>%)</td>
        <td class="text-end" th:text="${#numbers.formatDecimal(invoice.total.subtract(invoice.amount),1,'COMMA',2,'POINT')}"></td></tr>
    <tr class="fw-bold"><td class="text-end">Total</td>
        <td class="text-end" th:text="${#numbers.formatDecimal(invoice.total,1,'COMMA',2,'POINT')}"></td></tr>
    <tr><td class="text-end">Paid</td>
        <td class="text-end" th:text="${#numbers.formatDecimal(paid,1,'COMMA',2,'POINT')}"></td></tr>
    <tr class="fw-bold"><td class="text-end">Balance Due</td>
        <td class="text-end" th:text="${#numbers.formatDecimal(balance,1,'COMMA',2,'POINT')}"></td></tr>
    </tbody>
</table>
<p class="small text-muted" th:text="${invoice.notes}"></p>
<button class="btn btn-dark d-print-none" onclick="window.print()">Print / Save as PDF</button>
</body>
</html>
