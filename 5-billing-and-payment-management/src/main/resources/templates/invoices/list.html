<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main('Billing &amp; Payments', ~{::section})}">
<body>
<section>
    <div class="card-cp">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <form class="d-flex gap-2" th:action="@{/invoices}" method="get">
                <input class="form-control" style="width:260px" name="keyword" th:value="${keyword}"
                       placeholder="Search invoice number...">
                <button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button>
            </form>
            <a th:href="@{/invoices/new}" class="btn btn-brand"><i class="bi bi-plus-lg me-1"></i>Generate Invoice</a>
        </div>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>Invoice No</th><th>Client</th><th>Campaign</th><th>Issued</th><th>Due</th>
                    <th>Total (LKR)</th><th>Paid</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="inv : ${invoices}">
                    <td class="fw-semibold" th:text="${inv.invoiceNumber}"></td>
                    <td th:text="${inv.client != null ? inv.client.companyName : '-'}"></td>
                    <td th:text="${inv.campaign != null ? inv.campaign.name : '-'}"></td>
                    <td th:text="${inv.issueDate}"></td>
                    <td th:text="${inv.dueDate}"></td>
                    <td th:text="${#numbers.formatDecimal(inv.total,1,'COMMA',2,'POINT')}"></td>
                    <td th:text="${#numbers.formatDecimal(invoiceService.paidAmount(inv.id),1,'COMMA',2,'POINT')}"></td>
                    <td>
                        <span class="badge-soft"
                              th:classappend="${inv.status.name() == 'PAID'} ? 'bg-success-subtle text-success-emphasis' : 'bg-warning-subtle text-warning-emphasis'"
                              th:text="${inv.status}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/invoices/view/' + ${inv.id}}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></a>
                        <a th:href="@{'/invoices/print/' + ${inv.id}}" target="_blank" class="btn btn-sm btn-outline-dark"><i class="bi bi-printer"></i></a>
                        <a th:href="@{'/invoices/edit/' + ${inv.id}}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{'/invoices/delete/' + ${inv.id}}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Delete this invoice and all its payments?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(invoices)}"><td colspan="9"><div class="empty-state"><i class="bi bi-receipt"></i><div class="es-title">No invoices yet</div><div>Nothing to show in this view right now.</div></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
