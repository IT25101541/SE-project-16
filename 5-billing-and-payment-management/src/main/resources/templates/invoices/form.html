<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: main(${edit} ? 'Edit Invoice' : 'Generate Invoice', ~{::section})}">
<body>
<section>
    <div class="card-cp" style="max-width:820px">
<form th:action="${edit} ? @{'/invoices/update/' + ${invoice.id}} : @{/invoices/save}"
              th:object="${invoice}" method="post" novalidate>
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <ul class="mb-0 ps-3"><li th:each="e : ${#fields.globalErrors()}" th:text="${e}"></li></ul>
        </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label required">Client</label>
                    <select th:field="*{client}" class="form-select"
                            th:classappend="${#fields.hasErrors('client')} ? 'is-invalid'">
                        <option value="">-- Select a client --</option>
                        <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.companyName}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('client')}" th:errors="*{client}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Campaign</label>
                    <select th:field="*{campaign}" class="form-select"
                            th:classappend="${#fields.hasErrors('campaign')} ? 'is-invalid'">
                        <option value="">-- Not linked to a campaign --</option>
                        <option th:each="c : ${campaigns}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('campaign')}" th:errors="*{campaign}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Issue Date</label>
                    <input type="date" th:field="*{issueDate}" class="form-control"
                           th:classappend="${#fields.hasErrors('issueDate')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('issueDate')}" th:errors="*{issueDate}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Due Date</label>
                    <input type="date" th:field="*{dueDate}" class="form-control"
                           th:classappend="${#fields.hasErrors('dueDate')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Status</label>
                    <select th:field="*{status}" class="form-select">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label required">Amount (LKR)</label>
                    <input type="number" step="0.01" th:field="*{amount}" class="form-control"
                           th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label required">Tax (%)</label>
                    <input type="number" step="0.01" th:field="*{taxPercent}" class="form-control"
                           th:classappend="${#fields.hasErrors('taxPercent')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('taxPercent')}" th:errors="*{taxPercent}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea th:field="*{notes}" rows="2" class="form-control"
                              th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
                </div>
            </div>
            <hr class="my-4">
            <button class="btn btn-brand px-4"><i class="bi bi-save me-1"></i>
                <span th:text="${edit} ? 'Update Invoice' : 'Generate Invoice'"></span></button>
            <a th:href="@{/invoices}" class="btn btn-light">Cancel</a>
        </form>
    </div>
</section>
</body>
</html>
