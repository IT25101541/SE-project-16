spring.application.name=creativepulse-advertising
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CreativePulseDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YOUR_SQL_SERVER_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

spring.jpa.open-in-view=false
spring.sql.init.mode=never
