<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client | CreativePulse</title><link rel="stylesheet" href="/css/campaign.css"></head><body><header class="topbar"><div class="brand">CreativePulse <span>Campaign Management</span></div><nav><a href="/campaigns">Campaigns</a><a class="active" href="/clients">Clients</a></nav></header><main class="container narrow"><a class="back" href="/clients">← Back to clients</a><section class="form-card"><p class="eyebrow">CLIENT RECORD</p><h1 th:text="${client.id == null ? 'Add Client' : 'Edit Client'}">Add Client</h1><form th:action="@{/clients/save}" th:object="${client}" method="post"><input type="hidden" th:field="*{id}"><div class="grid"><label>Company name<input th:field="*{companyName}" placeholder="ABC Pvt Ltd"><span class="field-error" th:errors="*{companyName}"></span></label><label>Contact person<input th:field="*{contactPerson}" placeholder="Nimal Perera"><span class="field-error" th:errors="*{contactPerson}"></span></label><label>Email<input type="email" th:field="*{email}" placeholder="contact@abc.com"><span class="field-error" th:errors="*{email}"></span></label><label>Phone<input th:field="*{phone}" placeholder="0771234567"><span class="field-error" th:errors="*{phone}"></span></label><label class="full">Address<input th:field="*{address}" placeholder="Colombo, Sri Lanka"></label></div><div class="form-actions"><a class="btn secondary" href="/clients">Cancel</a><button class="btn">Save Client</button></div></form></section></main>
<script src="/js/campaign.js" defer></script>
</body></html>
