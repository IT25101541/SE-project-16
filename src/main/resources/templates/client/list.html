<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clients | CreativePulse</title><link rel="stylesheet" href="/css/campaign.css"></head><body><header class="topbar"><div class="brand">CreativePulse <span>Campaign Management</span></div><nav><a href="/campaigns">Campaigns</a><a class="active" href="/clients">Clients</a><a class="btn small" href="/clients/new">+ Add Client</a></nav></header><main class="container"><div class="hero"><div><p class="eyebrow">CLIENT RECORDS</p><h1>Clients</h1><p>Client records used when creating and linking campaigns.</p></div><a class="btn" href="/clients/new">Add Client</a></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Company</th><th>Contact</th><th>Email</th><th>Phone</th><th>Address</th><th></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(clients)}"><td colspan="6" class="empty">No clients yet.</td></tr><tr th:each="client : ${clients}"><td><strong th:text="${client.companyName}">ABC Ltd</strong></td><td th:text="${client.contactPerson}">Nimal</td><td th:text="${client.email}">email</td><td th:text="${client.phone}">phone</td><td th:text="${client.address}">address</td><td class="actions"><a th:href="@{/clients/edit/{id}(id=${client.id})}">Edit</a><form th:action="@{/clients/delete/{id}(id=${client.id})}" method="post" onsubmit="return confirm('Delete this client?');"><button>Delete</button></form></td></tr></tbody></table></div></section></main>
<script src="/js/campaign.js" defer></script>
</body></html>
