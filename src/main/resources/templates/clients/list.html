<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main('Client Management', ~{::section})}">
<body>
<section>
    <div class="card-cp">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <form class="d-flex gap-2" th:action="@{/clients}" method="get">
                <input class="form-control" style="width:260px" name="keyword" th:value="${keyword}"
                       placeholder="Search company or contact...">
                <button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button>
            </form>
            <a th:href="@{/clients/new}" class="btn btn-brand"><i class="bi bi-plus-lg me-1"></i>Add Client</a>
        </div>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>#</th><th>Company</th><th>Contact Person</th><th>Email</th>
                    <th>Phone</th><th>Industry</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="c,i : ${clients}">
                    <td th:text="${i.count}"></td>
                    <td class="fw-semibold" th:text="${c.companyName}"></td>
                    <td th:text="${c.contactPerson}"></td>
                    <td th:text="${c.email}"></td>
                    <td th:text="${c.phone}"></td>
                    <td th:text="${c.industry}"></td>
                    <td><span th:if="${c.active}" class="badge-soft bg-success-subtle text-success-emphasis">Active</span>
                        <span th:unless="${c.active}" class="badge-soft bg-secondary-subtle text-secondary-emphasis">Inactive</span></td>
                    <td class="text-end">
                        <a th:href="@{'/clients/view/' + ${c.id}}" class="btn btn-sm btn-outline-secondary" title="View"><i class="bi bi-eye"></i></a>
                        <a th:href="@{'/clients/edit/' + ${c.id}}" class="btn btn-sm btn-outline-primary" title="Edit"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{'/clients/delete/' + ${c.id}}" class="btn btn-sm btn-outline-danger" title="Delete"
                           onclick="return confirm('Delete this client?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clients)}"><td colspan="8"><div class="empty-state"><i class="bi bi-building"></i><div class="es-title">No clients yet</div><div>Nothing to show in this view right now.</div></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
