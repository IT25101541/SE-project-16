<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: main(${edit} ? 'Edit Client' : 'Add Client', ~{::section})}">
<body>
<section>
    <div class="card-cp" style="max-width:820px">
        <form th:action="${edit} ? @{'/clients/update/' + ${client.id}} : @{/clients/save}"
              th:object="${client}" method="post" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label required">Company Name</label>
                    <input type="text" th:field="*{companyName}" class="form-control"
                           th:classappend="${#fields.hasErrors('companyName')} ? 'is-invalid'"
                           placeholder="e.g. ABC Beverages PLC">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label required">Contact Person</label>
                    <input type="text" th:field="*{contactPerson}" class="form-control"
                           th:classappend="${#fields.hasErrors('contactPerson')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('contactPerson')}" th:errors="*{contactPerson}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label required">Email</label>
                    <input type="text" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label required">Phone</label>
                    <input type="text" th:field="*{phone}" class="form-control"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" placeholder="0112345678">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
                <div class="col-md-8">
                    <label class="form-label required">Address</label>
                    <input type="text" th:field="*{address}" class="form-control"
                           th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label required">Industry</label>
                    <input type="text" th:field="*{industry}" class="form-control"
                           th:classappend="${#fields.hasErrors('industry')} ? 'is-invalid'" placeholder="e.g. Retail">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('industry')}" th:errors="*{industry}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select th:field="*{active}" class="form-select">
                        <option th:value="true">Active</option>
                        <option th:value="false">Inactive</option>
                    </select>
                </div>
            </div>
            <hr class="my-4">
            <button class="btn btn-brand px-4"><i class="bi bi-save me-1"></i>
                <span th:text="${edit} ? 'Update Client' : 'Save Client'"></span></button>
            <a th:href="@{/clients}" class="btn btn-light">Cancel</a>
        </form>
    </div>
</section>
</body>
</html>
