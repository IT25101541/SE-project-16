<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign Details</title><link rel="stylesheet" href="/css/campaign.css"></head><body><header class="topbar"><div class="brand">CreativePulse <span>Campaign Management</span></div><nav><a href="/campaigns">Campaigns</a><a href="/clients">Clients</a></nav></header><main class="container narrow"><a class="back" href="/campaigns">← Back</a><section class="detail-card"><div class="detail-head"><div><p class="eyebrow">CAMPAIGN RECORD</p><h1 th:text="${campaign.campaignName}">Campaign</h1><p th:text="${campaign.description}">Description</p></div><span class="badge" th:classappend="' ' + ${#strings.toLowerCase(campaign.status.name())}" th:text="${campaign.status}">STATUS</span></div><div class="detail-grid"><div><span>Client</span><strong th:text="${campaign.client.companyName}">Client</strong></div><div><span>Team member</span><strong th:text="${campaign.assignedEmployee != null ? campaign.assignedEmployee.name : 'Unassigned'}">Unassigned</strong></div><div><span>Start date</span><strong th:text="${campaign.startDate}">Date</strong></div><div><span>Deadline</span><strong th:text="${campaign.deadline}">Date</strong></div></div><div class="progress-large"><div class="progress"><i th:style="'width:' + ${campaign.progress} + '%'" ></i></div><strong th:text="${campaign.progress + '%'}">0%</strong></div><div class="form-actions"><a class="btn secondary" th:href="@{/campaigns/edit/{id}(id=${campaign.id})}">Edit</a><form th:if="${!campaign.cancelled}" th:action="@{/campaigns/cancel/{id}(id=${campaign.id})}" method="post"><button class="btn danger" type="submit">Cancel Campaign</button></form><form th:if="${!campaign.archived}" th:action="@{/campaigns/archive/{id}(id=${campaign.id})}" method="post"><button class="btn secondary" type="submit">Archive</button></form><form th:action="@{/campaigns/delete/{id}(id=${campaign.id})}" method="post" onsubmit="return confirm('Remove this campaign permanently?');"><button class="btn danger-outline" type="submit">Remove</button></form></div></section></main>
<script src="/js/campaign.js" defer></script>
</body></html>
