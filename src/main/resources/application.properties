spring.application.name=CreativePulse
server.port=8080

# JSP views (login, dashboard, tasks, users ...)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Thymeleaf views (campaign + client pages) - only these folders use Thymeleaf,
# everything else falls through to JSP
spring.thymeleaf.view-names=campaign/*,client/*,employee/*
spring.thymeleaf.cache=false

# SQL Server - change password if your SQL Server SA password is different
spring.datasource.url=jdbc:sqlserver://DESKTOP-5HVF3KI\\SQLEXPRESS02;databaseName=CreativePulseDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA (campaign module creates/updates its own tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
