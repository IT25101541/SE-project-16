spring.application.name=creativepulse
server.port=8080

# MySQL (override with env vars DB_USER / DB_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/creativepulse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:12345678}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
