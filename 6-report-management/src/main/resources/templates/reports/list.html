<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main('Report Management', ~{::section})}">
<body>
<section>
    <div class="card-cp">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <form class="d-flex gap-2" th:action="@{/reports}" method="get">
                <input class="form-control" style="width:230px" name="keyword" th:value="${keyword}"
                       placeholder="Search report title...">
                <select name="type" class="form-select" style="width:210px">
                    <option value="">All report types</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}"
                            th:selected="${selectedType != null and selectedType == t}"></option>
                </select>
                <button class="btn btn-outline-secondary"><i class="bi bi-funnel"></i></button>
            </form>
            <a th:href="@{/reports/new}" class="btn btn-brand"><i class="bi bi-plus-lg me-1"></i>Generate Report</a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>#</th><th>Title</th><th>Type</th><th>Period</th>
                    <th>Generated By</th><th>Generated At</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="r,i : ${reports}">
                    <td th:text="${i.count}"></td>
                    <td class="fw-semibold" th:text="${r.title}"></td>
                    <td><span class="badge-soft bg-primary-subtle text-primary-emphasis" th:text="${r.type}"></span></td>
                    <td><small th:text="${r.periodFrom} + ' to ' + ${r.periodTo}"></small></td>
                    <td th:text="${r.generatedBy}"></td>
                    <td><small th:text="${#temporals.format(r.generatedAt,'yyyy-MM-dd HH:mm')}"></small></td>
                    <td class="text-end">
                        <a th:href="@{'/reports/view/' + ${r.id}}" class="btn btn-sm btn-outline-secondary" title="View"><i class="bi bi-eye"></i></a>
                        <a th:href="@{'/reports/export/' + ${r.id}}" class="btn btn-sm btn-outline-success" title="Export to Excel/CSV"><i class="bi bi-file-earmark-spreadsheet"></i></a>
                        <a th:href="@{'/reports/print/' + ${r.id}}" target="_blank" class="btn btn-sm btn-outline-dark" title="Print / PDF"><i class="bi bi-printer"></i></a>
                        <a th:href="@{'/reports/edit/' + ${r.id}}" class="btn btn-sm btn-outline-primary" title="Edit"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{'/reports/delete/' + ${r.id}}" class="btn btn-sm btn-outline-danger" title="Delete"
                           onclick="return confirm('Delete this report permanently?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reports)}">
                    <td colspan="7"><div class="empty-state"><i class="bi bi-file-earmark-bar-graph"></i><div class="es-title">No reports yet</div><div>Nothing to show in this view right now.</div></div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
