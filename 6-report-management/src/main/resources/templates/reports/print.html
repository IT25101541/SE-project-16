<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${report.title}">Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>h3{color:#2e1c8c}h4,h5{color:#140e38}.btn-dark{background:#5837ab;border-color:#5837ab}body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="p-5">
<h3 class="fw-bold mb-0">CreativePulse Advertising</h3>
<h5 th:text="${report.title}"></h5>
<p class="text-muted small">
    <span th:text="${report.type}"></span> |
    <span th:text="${report.periodFrom} + ' to ' + ${report.periodTo}"></span> |
    generated by <span th:text="${report.generatedBy}"></span>
</p>
<hr>
<pre style="font-size:12px" th:text="${report.content}"></pre>
<button class="btn btn-dark d-print-none" onclick="window.print()">Print / Save as PDF</button>
</body>
</html>
