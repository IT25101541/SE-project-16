<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | CreativePulse'">CreativePulse</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar" th:fragment="navbar(active)">
    <div class="topbar__inner">
        <a class="brand" th:href="@{/dashboard}">
            <span class="brand__pulse" aria-hidden="true"></span>
            <span class="brand__name">Creative<strong>Pulse</strong></span>
        </a>

        <nav class="topbar__nav" aria-label="Main navigation">
            <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'is-active'">Dashboard</a>
            <a th:href="@{/admin/users}" sec:authorize="hasRole('ADMIN')"
               th:classappend="${active == 'users'} ? 'is-active'">Manage Users</a>
            <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'is-active'">My Profile</a>
        </nav>

        <div class="topbar__user" th:if="${currentUser != null}">
            <div class="topbar__who">
                <span class="topbar__name" th:text="${currentUser.fullName}">Full Name</span>
                <span class="badge badge--role" th:text="${currentUser.role.displayName}">Role</span>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn--ghost btn--sm">Sign out</button>
            </form>
        </div>
    </div>
</header>

</body>
</html>
