<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register user')}"></head>
<body>
<header th:replace="~{fragments :: navbar('users')}"></header>

<main class="container container--narrow">

    <div class="page-head">
        <div>
            <h1>Register a new user</h1>
            <p class="muted">
                Enter the person's details and choose one role. A temporary password is generated
                and the account is created as Active.
            </p>
        </div>
    </div>

    <article class="card">
        <form th:action="@{/admin/users/new}" th:object="${form}" method="post" class="form" novalidate>
            <div class="field" th:classappend="${#fields.hasErrors('fullName')} ? 'field--error'">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" th:field="*{fullName}" required>
                <p class="field__error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Error</p>
            </div>

            <div class="field" th:classappend="${#fields.hasErrors('email')} ? 'field--error'">
                <label for="email">Email address</label>
                <input type="email" id="email" th:field="*{email}" required>
                <p class="field__error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>
            </div>

            <div class="field-row">
                <div class="field" th:classappend="${#fields.hasErrors('phone')} ? 'field--error'">
                    <label for="phone">Phone <span class="muted">(optional)</span></label>
                    <input type="tel" id="phone" th:field="*{phone}">
                    <p class="field__error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Error</p>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('role')} ? 'field--error'">
                    <label for="role">Role</label>
                    <select id="role" th:field="*{role}" required>
                        <option value="">Select a role</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.displayName}">Role</option>
                    </select>
                    <p class="field__error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">Error</p>
                </div>
            </div>

            <div class="form__actions">
                <a th:href="@{/admin/users}" class="btn btn--outline">Cancel</a>
                <button type="submit" class="btn btn--primary">Create account</button>
            </div>
        </form>
    </article>
</main>

</body>
</html>
