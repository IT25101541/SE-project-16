spring.application.name=creativepulse-user-management
server.port=8080

# ---- Database: file-based H2 (no installation needed) -------------------------
spring.datasource.url=jdbc:h2:file:./data/creativepulse
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- To use MySQL instead, comment the H2 lines above and uncomment these ------
# spring.datasource.url=jdbc:mysql://localhost:3306/creativepulse?createDatabaseIfNotExist=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_password

# ---- Thymeleaf ----------------------------------------------------------------
spring.thymeleaf.cache=false

# ---- App ----------------------------------------------------------------------
# Creates one sample account per role for demos. Set to false for production.
app.seed-demo-users=true
